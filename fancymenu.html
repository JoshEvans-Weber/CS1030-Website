<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Main Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: rgba(0, 0, 0, 0.2); /* Semi-transparent to let background visuals through */
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start; /* Aligns container to the left */
      padding-left: 5vw; /* Distance from the left edge */
    }
    .status-card {
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 1.8rem;
      width: 320px;
      text-align: left; /* Left-align all text elements */
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }
    .header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 0.8rem;
    }
    .server-icon { 
      width: 48px; 
      height: 48px; 
      border-radius: 8px; 
    }
    .server-title h2 {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.2;
    }
    .status-badge {
      display: flex;
      align-items: center;
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 2px;
    }
    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .online { background-color: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
    .offline { background-color: #e74c3c; box-shadow: 0 0 6px #e74c3c; }
    
    .motd { 
      margin: 0.8rem 0; 
      color: #ddd; 
      font-style: italic; 
      font-size: 0.88rem; 
      line-height: 1.3;
    }
    .player-count-text {
      font-size: 0.9rem;
      color: #bbb;
      margin-bottom: 0.5rem;
    }

    /* Player List Formatting */
    .player-section {
      margin-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 0.8rem;
    }
    .player-section h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 0.6rem;
    }
    .player-list {
      max-height: 200px;
      overflow-y: auto;
      list-style: none;
      padding-right: 4px;
    }
    .player-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .player-head {
      width: 22px;
      height: 22px;
      border-radius: 3px;
    }

    /* Custom Scrollbar */
    .player-list::-webkit-scrollbar { width: 4px; }
    .player-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 2px; }
  </style>
</head>
<body>

  <div class="status-card">
    <div class="header-row">
      <img id="icon" class="server-icon" src="" style="display:none;" alt="Server Icon" />
      <div class="server-title">
        <h2>Myth Harbor</h2>
        <div class="status-badge">
          <span id="dot" class="status-indicator offline"></span>
          <span id="status-text">Checking...</span>
        </div>
      </div>
    </div>

    <div id="motd" class="motd">---</div>
    <div class="player-count-text">Online: <strong id="players-count" style="color: #fff;">0 / 0</strong></div>
    
    <div class="player-section">
      <h3>Active Players</h3>
      <ul id="player-list" class="player-list">
        <li style="color: #666; font-size: 0.85rem;">Loading list...</li>
      </ul>
    </div>
  </div>

  <script>
    const SERVER_IP = "myth.minecraftharbor.net";

    async function fetchStatus() {
      try {
        const response = await fetch(`https://api.mcstatus.io/v2/status/java/${SERVER_IP}`);
        const data = await response.json();

        if (data.online) {
          document.getElementById('dot').className = "status-indicator online";
          document.getElementById('status-text').innerText = "Online";
          document.getElementById('players-count').innerText = `${data.players.online} / ${data.players.max}`;
          document.getElementById('motd').innerText = data.motd.clean || "Welcome!";
          
          if (data.icon) {
            const iconImg = document.getElementById('icon');
            iconImg.src = data.icon;
            iconImg.style.display = "block";
          }

          // Populate Player List
          const playerContainer = document.getElementById('player-list');
          if (data.players.list && data.players.list.length > 0) {
            playerContainer.innerHTML = data.players.list.map(player => `
              <li class="player-item">
                <img class="player-head" src="https://mc-heads.net/avatar/${player.uuid || player.name_clean}/22" alt="${player.name_clean}" />
                <span>${player.name_clean}</span>
              </li>
            `).join('');
          } else {
            playerContainer.innerHTML = `<li style="color: #888; font-size: 0.85rem;">No players online or list hidden.</li>`;
          }

        } else {
          document.getElementById('dot').className = "status-indicator offline";
          document.getElementById('status-text').innerText = "Offline";
          document.getElementById('motd').innerText = "Server is unreachable.";
          document.getElementById('player-list').innerHTML = `<li style="color: #888; font-size: 0.85rem;">Server offline</li>`;
        }
      } catch (err) {
        document.getElementById('status-text').innerText = "Error loading status";
      }
    }

    fetchStatus();
    setInterval(fetchStatus, 30000);
  </script>
</body>
</html>
